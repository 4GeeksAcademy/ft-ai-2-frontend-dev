[project]
name = "backend"
version = "0.1.0"
description = "FastAPI backend for ft-ai-2-frontend-dev"
readme = "README.md"
authors = [
    { name = "Shane B.", email = "dotfortun@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "tinydb>=4.8.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "python-multipart>=0.0.9",
    "email-validator>=2.3.0",
]

[dependency-groups]
dev = ["ruff>=0.9.0"]

[tool.uv]
package = false
