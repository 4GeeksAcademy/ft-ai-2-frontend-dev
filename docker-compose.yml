services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: brevity
      POSTGRES_USER: brevity
      POSTGRES_PASSWORD: brevity
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brevity -d brevity"]
      interval: 5s
      timeout: 5s
      retries: 10

  brevity-analytics:
    build: ./brevity-analytics
    ports:
      - "8001:8001"
    environment:
      CORS_ORIGINS: http://localhost:3000
      ANALYTICS_DB_PATH: /app/data/events.json
    volumes:
      - analytics-data:/app/data

  brevity-api:
    build: ./brevity-api
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      brevity-analytics:
        condition: service_started
    environment:
      DB_URL: postgresql+psycopg://brevity:brevity@postgres:5432/brevity
      JWT_SECRET: ${JWT_SECRET:-dev-secret}
      ANALYTICS_URL: http://brevity-analytics:8001
      CORS_ORIGINS: http://localhost:3000

  brevity:
    build:
      context: ./brevity
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
        NEXT_PUBLIC_ANALYTICS_URL: http://localhost:8001
    ports:
      - "3000:3000"
    depends_on:
      - brevity-api
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_ANALYTICS_URL: http://localhost:8001
      API_URL: http://brevity-api:8000

volumes:
  pgdata:
  analytics-data:
