[project]
name = "seasonal-stock-pipeline"
version = "0.1.0"
description = "Prefect-driven data pipeline for ecommerce seasonal stock recommendations"
authors = [
    { name = "Shane B.", email = "dotfortun@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "prefect>=3.0,<4.0",
    "pandas>=2.0",
    "numpy>=1.26",
]

[project.scripts]
run-pipeline = "pipeline:main"

[tool.uv]
package = false

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"
