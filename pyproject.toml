[project]
name = "agent_loop"
version = "0.1.0"
description = "Simple Agent Loop — a terminal-based chatbot powered by LiteLLM"
readme = "README.md"
authors = [
    { name = "Shane B.", email = "dotfortun@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "litellm>=1.0.0",
    "python-dotenv>=1.0.0",
    "tcod>=14.0.0",
]

[project.scripts]
agent-loop = "agent_loop:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"
